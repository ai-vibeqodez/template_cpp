# CI — C++ Template Project
#
# Триггеры: push/PR к main/master, release-теги v*.
# Jobs:
#   1. build-and-test — multi-platform (MSVC, GCC, Clang, AppleClang)
#   2. sanitizers — ASan + TSan на Ubuntu/GCC
#   3. clang-tidy — static analysis (requires build first)
#   4. formatting — clang-format check
#   5. release — publish GitHub Release (только на теги v*)

name: CI

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
    branches: [main, master]

permissions:
  contents: write

# Отменяем старые незавершённые запуски для того же PR / ветки
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build & Test (${{ matrix.name }})
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows-MSVC
            os: windows-latest
            cc: cl
            cxx: cl
          - name: Linux-GCC
            os: ubuntu-latest
            cc: gcc
            cxx: g++
          - name: Linux-Clang
            os: ubuntu-latest
            cc: clang
            cxx: clang++
          - name: macOS-AppleClang
            os: macos-latest
            cc: clang
            cxx: clang++

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure & Build
        uses: ai-warevo/.github/ci/actions/cmake-build@main
        env:
          CC: ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}
        with:
          source_dir: .
          build_type: Release
          extra_args: -DAW_TEMPLATE_CPP_BUILD_EXAMPLES=ON -DAW_TEMPLATE_CPP_WARNINGS_AS_ERRORS=ON
          install: true

      - name: Run Tests
        uses: ai-warevo/.github/ci/actions/ctest-run@main
        with:
          source_dir: .
          config: Release
          output_on_failure: true

      - name: Run Examples (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Get-ChildItem .\build\examples\Release\aw_template_cpp_example_*.exe | ForEach-Object {
            Write-Host "=== $($_.Name)"
            & $_.FullName
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

      - name: Run Examples (Unix)
        if: runner.os != 'Windows'
        run: |
          for example in ./build/examples/aw_template_cpp_example_*; do
            echo "=== $example"
            "$example"
          done

      - name: Package Artifacts (Windows)
        if: runner.os == 'Windows'
        run: Compress-Archive -Path install\* -DestinationPath aw_template_cpp-${{ matrix.name }}.zip

      - name: Package Artifacts (Unix)
        if: runner.os != 'Windows'
        run: tar -czvf aw_template_cpp-${{ matrix.name }}.tar.gz -C install .

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: aw_template_cpp-${{ matrix.name }}
          path: aw_template_cpp-${{ matrix.name }}.*

  sanitizers:
    name: Sanitizers (${{ matrix.sanitizer }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        sanitizer: [address, thread]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Relax ASLR for ThreadSanitizer
        if: matrix.sanitizer == 'thread'
        run: sudo sysctl vm.mmap_rnd_bits=28

      - name: Configure & Build
        uses: ai-warevo/.github/ci/actions/cmake-build@main
        env:
          CC: gcc
          CXX: g++
        with:
          source_dir: .
          build_type: RelWithDebInfo
          extra_args: -DAW_TEMPLATE_CPP_BUILD_TESTS=ON -DAW_TEMPLATE_CPP_SANITIZE=${{ matrix.sanitizer }}

      - name: Run CTest
        uses: ai-warevo/.github/ci/actions/ctest-run@main
        with:
          source_dir: .
          output_on_failure: true
          timeout: 120

  clang-tidy:
    name: Clang-Tidy Lint
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run clang-tidy
        uses: ai-warevo/.github/ci/actions/clang-tidy@main
        with:
          source_dir: .
          build_dir: build
          checks: >-
            *,
            bugprone-*,
            cppcoreguidelines-avoid-capturing-lambda-coroutines,
            cppcoreguidelines-avoid-reference-coroutine-parameters,
            cppcoreguidelines-missing-std-forward,
            cppcoreguidelines-slicing,
            misc-const-correctness,
            misc-definitions-in-headers,
            misc-unused-using-decls,
            modernize-use-nodiscard,
            modernize-use-override,
            modernize-use-using,
            performance-*,
            readability-container-size-empty,
            readability-redundant-member-init,
            -bugprone-easily-swappable-parameters,
            -bugprone-exception-escape,
            -bugprone-unchecked-optional-access
          header_filter: .*/include/.*

  formatting:
    name: Formatting Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check formatting
        uses: ai-warevo/.github/ci/actions/clang-format@main
        with:
          source_dir: .
          extensions: cpp,hpp
          config_file: .clang-format

  release:
    name: Publish GitHub Release
    needs: [build-and-test]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: ai-warevo/.github/ci/actions/download-artifacts@main
        with:
          pattern: '*'
          merge-multiple: true
          path: artifacts

      - name: Extract release notes from CHANGELOG.md
        uses: ai-warevo/.github/ci/actions/changelog-release@main
        id: changelog
        env:
          TAG: ${{ github.ref_name }}
        with:
          tag: ${{ github.ref_name }}
          release-body: release_body.md

      - name: Add Quick CMake Integration to Release Body
        env:
          TAG: ${{ github.ref_name }}
        run: |
          {
            printf '\n### 🚀 Quick CMake Integration (`FetchContent`)\n\n'
            cat <<'EOF'
          ```cmake
          include(FetchContent)
          FetchContent_Declare(
              aw_template_cpp
              GIT_REPOSITORY https://github.com/ai-warevo/template-cpp.git
          EOF
            printf '    GIT_TAG        %s\n' "$TAG"
            cat <<'EOF'
          )
          FetchContent_MakeAvailable(aw_template_cpp)
          target_link_libraries(your_target PRIVATE aw::template_cpp)
          ```
          EOF
          } >> release_body.md

          cat release_body.md

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          body_path: release_body.md
