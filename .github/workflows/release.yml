# Release — derive version → build → release + Docker
#
# Triggers:
#   - tag push v* → release from existing CHANGELOG (manual tag creation)
#   - workflow_dispatch → auto-release: generates changelog, derives version, publishes release

name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version override (X.Y.Z); use auto to derive from CHANGELOG'
        required: false
        default: auto
        type: string

permissions:
  contents: write
  packages: write
  actions: write

jobs:
  release:
    uses: ai-warevo/.github/.github/workflows/reusable-release.yml@main
    with:
      source_dir: .
      build_dir: build
      docker_context: .
      dockerfile: Dockerfile
      image_name: template-cpp
      version: ${{ github.event.inputs.version || 'auto' }}
