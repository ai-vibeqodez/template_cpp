name: Tests & Coverage

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

permissions:
  contents: write

jobs:
  unit-tests-and-coverage:
    name: Unit Tests & Coverage
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure & Build Tests with Coverage
        env:
          CC: gcc
          CXX: g++
        run: |
          cmake -B build \
            -DCMAKE_BUILD_TYPE=Debug \
            -DAW_TEMPLATE_CPP_BUILD_TESTS=ON \
            -DAW_TEMPLATE_CPP_ENABLE_COVERAGE=ON
          cmake --build build --parallel

      - name: Run CTest
        run: ctest --test-dir build -C Debug --output-on-failure

      - name: Generate Coverage Reports (XML & HTML)
        uses: ai-warevo/.github/ci/actions/gcovr-report@main
        with:
          source_dir: .
          build_dir: build
          source_filter: include/ src/
          exclude: _deps/*
          output_dir: htmlcov

      - name: Parse Coverage Metrics
        id: coverage_parser
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        uses: ai-warevo/.github/ci/actions/coverage-parser@main
        with:
          xml_path: coverage.xml

      - name: Generate Coverage Badge
        id: badge_generator
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        uses: ai-warevo/.github/ci/actions/badge@main
        with:
          width: '99'
          height: '20'
          text_left: 'coverage'
          text_right: '${{ steps.coverage_parser.outputs.percent }}'
          bg_color_right: '${{ steps.coverage_parser.outputs.color }}'
          filename: 'coverage.svg'

      - name: Deploy Coverage Badge
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        uses: ai-warevo/.github/ci/actions/badge-deploy@main
        with:
          badge_path: coverage.svg
          branch: badges

      - name: Deployment Preparation (gh-pages)
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        run: touch htmlcov/.nojekyll

      - name: Deploy Coverage Report to gh-pages
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: htmlcov
