# Weekly Deep — sanitizers + coverage (scheduled + manual)
#
# Triggers: scheduled weekly on Monday 00:00 UTC, or manual (workflow_dispatch)
# Calls: reusable-sanitizers.yml from ai-warevo/.github
#
# This workflow runs the comprehensive test suite on the generated CI project:
#   - ASan + UBSan (full test suite in container)
#   - TSan (full test suite on host)
#   - Coverage (gcovr → badge → GitHub Pages, main branch only)

name: Weekly Deep

on:
  schedule:
    - cron: '0 0 * * 1'  # every Monday at 00:00 UTC
  workflow_dispatch:  # allow manual trigger for testing

permissions:
  contents: write
  packages: write

jobs:
  sanitizers:
    uses: ai-warevo/.github/.github/workflows/reusable-sanitizers.yml@main
    with:
      source_dir: .ci-project
      build_dir: build
      container_image: ghcr.io/ai-warevo/ci-cpp23
      cmake_sanitize_var: CI_CHECK_SANITIZE
      cmake_extra_args: '-DCI_CHECK_BUILD_TESTS=ON'
      ctest_timeout: 300
      tsan_repeat_count: 1
      tsan_test_regex: ''
      asan_options: 'detect_leaks=1:halt_on_error=1'
      tsan_options: 'halt_on_error=1:second_deadlock_stack=1'
      setup_command: >-
        mkdir -p .ci-project && bash templates/scaffold.sh init static --name ci_check --ns aw::ci --out .ci-project

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/ai-warevo/ci-cpp23
      options: --user root
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate project
        run: mkdir -p .ci-project && bash templates/scaffold.sh init static --name ci_check --ns aw::ci --out .ci-project

      - name: Install toolchain
        id: tc
        uses: ai-warevo/.github/.github/actions/setup-toolchain@main
        with:
          toolchain: gcc15
          container_mode: true

      - name: Configure & Build
        uses: ai-warevo/.github/.github/actions/cmake-build@main
        with:
          source_dir: .ci-project
          build_dir: build
          build_type: Debug
          extra_args: >-
            ${{ steps.tc.outputs.cmake_args }}
            -DCI_CHECK_BUILD_TESTS=ON
            -DAW_ENABLE_COVERAGE=ON

      - name: Run Tests
        uses: ai-warevo/.github/.github/actions/ctest-run@main
        with:
          source_dir: .ci-project
          build_dir: build
          config: Debug
          output_on_failure: true
          timeout: 300

      - name: Generate Coverage Reports (XML & HTML)
        uses: ai-warevo/.github/.github/actions/gcovr-report@main
        with:
          source_dir: .ci-project
          build_dir: build
          source_filter: "include/ src/ examples/"
          exclude: _deps/*
          output_dir: htmlcov
          xml_path: coverage.xml

      - name: Parse Coverage Metrics
        id: coverage_parser
        uses: ai-warevo/.github/.github/actions/coverage-parser@main
        with:
          xml_path: coverage.xml

      - name: Generate Coverage Badge
        id: badge_generator
        uses: ai-warevo/.github/.github/actions/badge@main
        with:
          width: '99'
          height: '20'
          text_left: 'coverage'
          text_right: '${{ steps.coverage_parser.outputs.percent }}%'
          bg_color_right: '${{ steps.coverage_parser.outputs.color }}'
          filename: 'coverage.svg'

      - name: Upload Badge Artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-badge
          path: coverage.svg
          retention-days: 1
          if-no-files-found: error

      - name: Upload Coverage HTML
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-html
          path: htmlcov/
          retention-days: 1
          if-no-files-found: error

  deploy:
    name: Deploy Coverage
    runs-on: ubuntu-latest
    needs: coverage
    if: needs.coverage.result == 'success' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download Badge
        uses: actions/download-artifact@v4
        with:
          name: coverage-badge
          path: .

      - name: Download Coverage HTML
        uses: actions/download-artifact@v4
        with:
          name: coverage-html
          path: htmlcov/

      - name: Deploy Badge
        uses: ai-warevo/.github/.github/actions/badge-deploy@main
        with:
          badge_path: coverage.svg

      - name: Deploy Coverage Report to gh-pages
        uses: ai-warevo/.github/.github/actions/coverage-html-deploy@main
        with:
          folder: htmlcov
