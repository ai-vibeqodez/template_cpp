# ShellCheck — lint generator scripts
#
# Проверяет Bash-скрипты генератора шаблонов.
# Работает на ubuntu-latest (нативный runner, нужен apt-get).

name: ShellCheck

on:
  workflow_dispatch:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  shellcheck:
    name: ShellCheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Lint generator scripts
        run: shellcheck templates/*.sh
