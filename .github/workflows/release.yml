# Release — derive version → promote changelog → publish release
#
# Triggers:
#   - tag push v* → release from existing CHANGELOG
#   - workflow_dispatch → promote CHANGELOG, update VERSION, publish release

name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version override (X.Y.Z); use auto to derive from CHANGELOG'
        required: false
        default: auto
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare-release:
    name: Prepare release metadata and tag
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    outputs:
      release_tag: ${{ steps.version.outputs.release_version }}
      release_version_stripped: ${{ steps.version.outputs.release_version_stripped }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@main
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve release version
        id: version
        uses: ai-warevo/.github/.github/actions/release-version@main
        with:
          version: ${{ inputs.version || 'auto' }}

      - name: Promote changelog and update VERSION
        uses: ai-warevo/.github/.github/actions/changelog-promote@main
        with:
          version: ${{ steps.version.outputs.release_version_stripped }}

      - name: Commit metadata and push tag
        uses: ai-warevo/.github/.github/actions/release-commit-tag@main
        with:
          version: ${{ steps.version.outputs.release_version }}
          branch: ${{ github.ref_name }}

  publish-release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: prepare-release
    if: always() && (needs.prepare-release.result == 'success' || (github.event_name == 'push' && needs.prepare-release.result == 'skipped'))
    steps:
      - name: Checkout release tag
        uses: actions/checkout@main
        with:
          ref: ${{ github.event_name == 'push' && github.ref_name || needs.prepare-release.outputs.release_tag }}
          fetch-depth: 0

      - name: Extract release notes
        id: notes
        uses: ai-warevo/.github/.github/actions/changelog-release@main
        with:
          tag: ${{ github.event_name == 'push' && github.ref_name || needs.prepare-release.outputs.release_tag }}
          what-included: 'C++23 project generator templates and build tooling'
          quick-start: 'See the README for installation and usage.'

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65
        with:
          tag_name: ${{ github.event_name == 'push' && github.ref_name || needs.prepare-release.outputs.release_tag }}
          name: ${{ github.event_name == 'push' && github.ref_name || needs.prepare-release.outputs.release_tag }}
          body_path: ${{ steps.notes.outputs.body_path }}
          generate_release_notes: false
