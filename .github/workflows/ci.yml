name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    name: Build & Test (${{ matrix.name }})
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux-GCC
            os: ubuntu-latest
            cc: gcc
            cxx: g++
          - name: Linux-Clang
            os: ubuntu-latest
            cc: clang
            cxx: clang++
          - name: macOS-AppleClang
            os: macos-latest
            cc: clang
            cxx: clang++

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure & Build
        env:
          CC: ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}
        run: |
          cmake -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DAW_TEMPLATE_CPP_BUILD_TESTS=ON \
            -DAW_TEMPLATE_CPP_WARNINGS_AS_ERRORS=ON
          cmake --build build --parallel

      - name: Run Tests
        run: ctest --test-dir build --output-on-failure --parallel

  sanitizers:
    name: Sanitizers (${{ matrix.sanitizer }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        sanitizer: [ address, thread ]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Relax ASLR for ThreadSanitizer
        if: matrix.sanitizer == 'thread'
        run: sudo sysctl vm.mmap_rnd_bits=28

      - name: Configure & Build
        env:
          CC: gcc
          CXX: g++
        run: |
          cmake -B build \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DAW_TEMPLATE_CPP_BUILD_TESTS=ON \
            -DAW_TEMPLATE_CPP_SANITIZE=${{ matrix.sanitizer }}
          cmake --build build --parallel

      - name: Run CTest
        run: ctest --test-dir build --output-on-failure --timeout 120

  formatting:
    name: Formatting Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install clang-format
        run: sudo apt-get update && sudo apt-get install -y clang-format

      - name: Check formatting
        run: |
          find include src -name '*.hpp' -o -name '*.cpp' | xargs clang-format --dry-run --Werror
